name: Build Images

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  matrix:
    name: Generate build matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate matrix
        id: set-matrix
        shell: bash
        run: |
          # Find all subdirectories with Dockerfile
          matrix_json='{"include":['
          first=true

          for dir in */; do
              dir_name="${dir%/}"
              # Skip hidden directories and common non-container directories
              [[ "$dir_name" == .* ]] && continue

              if [ -f "$dir_name/Dockerfile" ]; then
                  if [ "$first" = false ]; then
                      matrix_json+=','
                  fi
                  matrix_json+="{\"name\":\"$dir_name\"}"
                  first=false
              fi
          done

          matrix_json+=']}'
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"
          echo "Generated matrix: $matrix_json"

  build:
    name: Build images
    needs: matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags from Dockerfile version
        id: version
        shell: bash
        run: |
          set -euo pipefail

              OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
              IMAGE="ghcr.io/${OWNER_LOWER}/${{ matrix.name }}"

          VERSION=$(awk -F '"' '/LABEL org.opencontainers.image.version=/ {print $2; exit}' "${{ matrix.name }}/Dockerfile" || true)
          if [ -z "$VERSION" ]; then
              VERSION="unknown"
          fi

          TAGS=()
          TAGS+=("${IMAGE}:latest")

          if [[ "$VERSION" != "unknown" && "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"

              TAGS+=("${IMAGE}:${MAJOR}")
              TAGS+=("${IMAGE}:${MAJOR}.${MINOR}")
              TAGS+=("${IMAGE}:${MAJOR}.${MINOR}.${PATCH}")
          fi

          {
              echo "version=$VERSION"
              echo "tags<<EOF"
              printf '%s\n' "${TAGS[@]}"
              echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Detected version: $VERSION"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.name }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
